<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - not found</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div style="max-width:640px;margin:70px auto;padding:0 18px">
    <div class="card">
      <div class="card-h"><i class="fa-solid fa-compass"></i> 404 &mdash; page not found</div>
      <div class="card-b" style="padding:26px">
        <h1 style="margin:0 0 8px;font:700 26px var(--font-display)">This page wandered off.</h1>
        <p class="muted" style="margin:0 0 16px">
          It may have been deleted, moved, or it never existed. The server is fine, the link is not.
        </p>
        <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> Back to the feed</a>
      </div>
    </div>
  </div>
</body>
</html>
